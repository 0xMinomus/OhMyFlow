[package]
name = "ohmyflow"
version = "2.0.0"
description = "AI Photo Culler 100% Local for Windows & Linux"
authors = ["OhMyFlow"]
edition = "2021"

[lib]
name = "ohmyflow_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "gif"] }
fast_image_resize = { version = "5", features = ["image"] }
kamadak-exif = "0.5"
tract-onnx = "0.21"
sha2 = "0.10"
md-5 = "0.10"
url = "2"
[profile.release]
panic = "abort"
codegen-units = 16
opt-level = 3
strip = true
